<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agon Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#15110d; --panel:#1d1712; --ink:#f0e2c8; --muted:#b29c7e; --rule:#b27a4c; --hair:#3a2c20;
  --accent:#d4703c; --gold:#d8a94c; --ok:#9cbf6a; --warn:#e48a55; --bad:#e06650; --soft:#2a2018;
  --display:"Cinzel",Georgia,serif; --label:"EB Garamond",Georgia,serif; --entry:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--label); font-size: 16px; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 14px 0; border-bottom: 1px solid var(--rule); }
header h1 { font: 700 15px/1 var(--display); letter-spacing: .14em; margin: 0 8px 10px 0; color: var(--gold); }
.tab { font: 600 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: none; border: 0;
  border-bottom: 2px solid transparent; padding: 8px 4px 9px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
.btn { font: 500 12px/1 var(--entry); color: var(--ink); background: var(--soft); border: 1px solid var(--hair); border-radius: 3px; padding: 6px 10px; cursor: pointer; margin-bottom: 8px; }
.btn:hover { border-color: var(--rule); }
main { flex: 1; overflow-y: auto; padding: 6px 14px 16px; }
ol { list-style: none; margin: 0; padding: 0; }
li { padding: 10px 2px 10px 12px; border-bottom: 1px solid var(--hair); border-left: 3px solid var(--hair); margin: 0 0 0 -2px; }
li.hit { border-left-color: var(--ok); } li.dh { border-left-color: var(--gold); } li.con { border-left-color: var(--warn); } li.miss { border-left-color: var(--bad); }
.top { display: flex; align-items: baseline; gap: 8px; }
.who { font: 600 15px/1.2 var(--label); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.time { font: 12px var(--entry); color: var(--muted); margin-left: auto; white-space: nowrap; }
.what { font: italic 15px/1.3 var(--label); color: var(--muted); margin-top: 1px; }
.sum { font: 500 15px/1.35 var(--entry); margin-top: 4px; display: flex; align-items: flex-start; gap: 8px; }
.sum span { flex: 1; }
li.hit .sum span { color: #cfe3b2; } li.dh .sum span { color: #f3d48c; } li.con .sum span { color: #f2b48c; } li.miss .sum span { color: #f0a090; }
.note { font: 13px/1.35 var(--entry); color: var(--gold); margin-top: 3px; }
.info { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--muted); background: none; color: var(--muted);
  font: italic 600 12px/18px Georgia, serif; text-align: center; padding: 0; cursor: pointer; }
.info[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.math { white-space: pre-wrap; font: 12.5px/1.45 var(--entry); color: var(--muted); background: var(--soft); border-radius: 3px; padding: 7px 9px; margin-top: 6px; }
.btn.off { visibility: hidden; }
/* party cards */
#party { display: grid; gap: 10px; padding-top: 6px; }
.card { border: 1px solid var(--hair); border-left: 3px solid var(--rule); border-radius: 3px; background: var(--panel); padding: 9px 11px 10px; margin: 0; }
.ctop { display: flex; align-items: center; gap: 8px; }
.name { flex: 1; text-align: left; background: none; border: 0; color: var(--ink); padding: 0; cursor: pointer; font: 600 17px/1.2 var(--label); display: flex; gap: 6px; align-items: baseline; }
.car { color: var(--muted); font-size: 12px; width: 10px; }
.find { font: 500 11px/1 var(--entry); color: var(--muted); background: none; border: 1px solid var(--hair); border-radius: 3px; padding: 4px 7px; cursor: pointer; }
.find:hover { color: var(--ink); border-color: var(--rule); }
.sub { font: italic 14px/1.3 var(--label); color: var(--muted); margin: 1px 0 6px 16px; }
.hprow { display: flex; align-items: center; gap: 7px; font: 13px var(--entry); }
.hprow b { font: 600 16px var(--entry); }
.hpbar { flex: 1; height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.hpbar span { display: block; height: 100%; background: var(--ok); }
.hpbar.mid span { background: var(--gold); } .hpbar.low span { background: var(--bad); }
.mut { color: var(--muted); } .small { font: 12px/1.4 var(--entry); margin-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 7px 0 2px; font: 12px var(--entry); color: var(--muted); }
.chips b { color: var(--ink); font-weight: 600; font-size: 14px; margin-right: 3px; }
.theion { display: flex; gap: 10px; margin-top: 6px; }
.band { display: inline-flex; gap: 2px; }
.band i { width: 9px; height: 7px; border: 1px solid; border-radius: 1px; transform: skewX(-15deg); display: inline-block; }
.more { border-top: 1px solid var(--hair); margin-top: 9px; padding-top: 4px; font: 13px/1.4 var(--entry); }
.more h4 { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 10px 0 5px; }
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tri h4 { margin-top: 6px; }
.tr { display: grid; grid-template-columns: 1fr auto 26px; gap: 4px; font-size: 12.5px; }
.tr em { font-style: normal; color: var(--muted); text-align: right; }
.tr.zero { color: var(--muted); opacity: .7; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tags span { background: var(--soft); border: 1px solid var(--hair); border-radius: 10px; padding: 2px 8px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.tags .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--hair); white-space: nowrap; }
td:first-child { white-space: normal; }
tr.held td:first-child { color: var(--gold); }
.foot { margin-top: 10px; }
.stx { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; font: 600 12px var(--entry); }
.stx span { display: inline-flex; align-items: center; gap: 4px; }
.stx img { width: 18px; height: 18px; }
.credit { font: 10.5px var(--entry); color: var(--muted); text-align: center; margin: 14px 0 0; } .credit a { color: inherit; }
.empty { color: var(--muted); font-style: italic; text-align: center; padding: 40px 10px; }
</style>
</head>
<body>
<header>
  <h1>AGON</h1>
  <button class="tab" role="tab" aria-selected="true" id="tabLog">Roll Log</button>
  <button class="tab" role="tab" aria-selected="false" id="tabParty">Party</button>
  <span class="spacer"></span>
  <button class="btn" id="btnClear" hidden title="Clear the log for everyone in the room">Clear log</button>
</header>
<main>
  <section id="paneLog">
    <ol id="log"></ol>
    <p class="empty" id="empty">No rolls yet. Rolls made on Agon sheets appear here for everyone in the room.</p>
  </section>
  <section id="paneParty" hidden>
    <ol id="party"></ol>
    <p class="credit">Status icons: <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> (CC BY 3.0)</p>
    <p class="empty" id="partyEmpty">No characters yet. A character shows up here once its player opens their Agon sheet, selects their token, and clicks <b>Link to selected token</b>.</p>
  </section>
</main>
<script type="module" src="table.js?v=1.4.0"></script>
</body>
</html>
